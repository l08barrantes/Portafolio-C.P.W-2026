<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Formulario de registro del sitio-demo">
    <meta name="keywords" content="registro, formulario, sitio-demo">
    <meta name="author" content="Liam Barrantes">
    <title>Formulario de registro</title>
</head>
<body>
    <header>
        <!--Header: cabecera de la página y genaralmente se repite en todo el sitio-->
        <h1>Formulario de registro</h1>
        <p>Sitio de demostración del módulo de codificación de páginas web</p>
    </header>

        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="Registro.html">Registro</a></li>
                <li><a href="horario.html">Horario</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h2>Formulario de matrícula</h2>
        <form action="procesar_registro.php" method="post">
            <!--FORM: Contenedor del formulario. action: es donde se mete el formulario method: es el método de envío de los datos por el cuerpo de su solicitud-->
            <fieldset> <!-- Contenedor de los elementos del formulario -->

            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" required><br><br>

            <label for="apellido">Apellido:</label>
            <input type="text" id="apellido" name="apellido" required><br><br>

            <label for="email">Correo electrónico:</label>
            <input type="email" id="email" name="email" required><br><br>

            <label for="telefono">Teléfono:</label>
            <input type="tel" id="telefono" name="telefono"><br><br>

        
            <input type="submit" value="Registrar">
        </form>
        <fieldset>
            <legend>Detalles de Matrícula</legend>
            <p>
                <label for="telefono">Teléfono:</label>
                <input type="tel" id="telefono" name="telefono"><br><br>
            </p>

            <p>
                <label for="fecha">Fecha de inicio:</label>
                <input type="date" id="fecha" name="fecha"><br><br>
            </p>

            <p>
                <label for="edad">Edad:</label>
                <input type="number" id="edad" name="edad"><br><br>
            </p>
        </fieldset>
        
        <fieldset>
            <legend>Modalidad</legend>
            <input type="radio" id="presencial" name="modalidad" value="presencial">
            <label for="presencial">Presencial</label><br>
            <input type="radio" id="virtual" name="modalidad" value="virtual">
            <label for="virtual">Virtual</label><br>
            <input type="radio" id="mixta" name="modalidad" value="mixta">
            <label for="mixta">Mixta</label><br><br>
        </fieldset>
        <p>
            <label for="horario">Horario preferido</label><br>
            <select id="horario" name="horario">
                <option value="mañana">Mañana</option>
                <option value="tarde">Tarde</option>
                <option value="noche">Noche</option>
        </p>
        <fieldset>
            <legend>Intereses</legend>
            <label for="comentarios">Comentarios:</label>
            <!--TEXTAREA:es un cuadro de texto multilinea. rows: cantidad de filas cols: cantidad de columnas placeholder: texto que aparece dentro del cuadro de texto-->
            <textarea id="comentarios" name="comentarios" rows="4" cols="50" placeholder="Escribe tus comentarios aquí..."></textarea>br><br>
        </fieldset>
    </main>
    <footer>
      <!--Footer: Pie, créditos, contacto, derechos-->
      <p>
        © 2026 INA. Programa Desarrollo de Páginas Web. Todos los derechos
        reservados
      </p>
    </footer>
</body>
</html>
