<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="author" content="Liam Barrantes Calvo">
<title>The Strawberry Tour — Galería</title>
<meta name="description" content="Galería de fotos de The Strawberry Tour: invernadero, cosecha, degustación y atardecer en la finca.">
<link rel="stylesheet" href="css/estilos.css">
<link rel="icon" href="recursos-html/favicon.png" type="image/png">
</head>
<body>

<header class="site-header">
  <nav class="main-nav">
    <a href="Index.html" class="nav-brand">🍓 The Strawberry Tour</a>
    <button class="nav-toggle" aria-label="Abrir menú" aria-expanded="false" aria-controls="nav-links">
      <span></span><span></span><span></span>
    </button>
    <ul class="nav-links" id="nav-links">
      <li><a href="Index.html">Inicio</a></li>
      <li><a href="Listas.html">Servicios</a></li>
      <li><a href="Galeria.html" class="active">Galería</a></li>
      <li><a href="Contacto.html">Contacto</a></li>
    </ul>
    <a href="Contacto.html" class="nav-cta">Reservar</a>
  </nav>

  <div class="hero hero-page">
    <p class="hero-eyebrow">Galería</p>
    <h1 class="hero-title">Un vistazo a la finca</h1>
    <p class="hero-sub">Momentos del recorrido, del invernadero a la mesa.</p>
  </div>

  <svg class="hero-row" viewBox="0 0 1200 60" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0,30 Q150,0 300,30 T600,30 T900,30 T1200,30 V60 H0 Z"></path>
  </svg>
</header>

<main>

  <section class="section section-gallery">
    <span class="eyebrow eyebrow-center">Fotos del tour</span>
    <h2 class="section-title center">Así se vive la experiencia</h2>

    <div class="gallery-grid">
      <figure class="gallery-item">
        <img class="gallery-photo" src="recursos-html/invernadero.jpg" alt="Invernadero de fresas">
        <figcaption>Bienvenida al invernadero</figcaption>
      </figure>
      <figure class="gallery-item">
        <img class="gallery-photo" src="recursos-html/fresas1.jpg" alt="Fresas en su punto óptimo de maduración">
        <figcaption>Fresas en su punto óptimo</figcaption>
      </figure>
      <figure class="gallery-item">
        <img class="gallery-photo" src="recursos-html/recoleccion.jpg" alt="Recolección de fresas en el invernadero">
        <figcaption>Técnica de recolección</figcaption>
      </figure>
      <figure class="gallery-item">
        <img class="gallery-photo" src="recursos-html/fresas2.jpg" alt="Cesta llena de fresas recién recolectadas">
        <figcaption>Cesta lista para pesar</figcaption>
      </figure>
      <figure class="gallery-item">
        <img class="gallery-photo" src="recursos-html/mermelada.jpg" alt="Frascos de mermelada artesanal de fresa">
        <figcaption>Mermeladas artesanales</figcaption>
      </figure>
      <figure class="gallery-item">
        <img class="gallery-photo" src="recursos-html/mesa.jpg" alt="Mesa de degustación decorada con fresas">
        <figcaption>Mesa de degustación</figcaption>
      </figure>
      <figure class="gallery-item">
        <img class="gallery-photo" src="recursos-html/fresas3.jpg" alt="Atardecer sobre el cultivo de fresas">
        <figcaption>Atardecer sobre el cultivo</figcaption>
      </figure>
      <figure class="gallery-item">
        <img class="gallery-photo" src="recursos-html/grupofresa.jpg" alt="Grupo de visitantes cerrando el recorrido">
        <figcaption>Grupo cerrando el recorrido</figcaption>
      </figure>
    </div>

  </section>

</main>

<footer class="site-footer">
  <p>© 2026 The Strawberry Tour. Todos los derechos reservados.</p>
</footer>

<script>
  const toggle = document.querySelector('.nav-toggle');
  const links = document.querySelector('#nav-links');
  toggle.addEventListener('click', () => {
    const isOpen = links.classList.toggle('open');
    toggle.setAttribute('aria-expanded', isOpen);
  });
</script>

</body>
</html>
